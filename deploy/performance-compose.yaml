name: bugboard26-performance
services:
  db:
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    cpus: 4
    cpuset: '0-3'
    mem_limit: 2g
    environment:
      POSTGRES_DB: bugboard26_performance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Missing private admin password}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Missing migration password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Missing runtime password}
    volumes:
      - performance_db:/var/lib/postgresql
      - ./performance-init.sh:/docker-entrypoint-initdb.d/10-bugboard26.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d bugboard26_performance']
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    image: bugboard26-backend
    cpus: 4
    cpuset: '0-3'
    mem_limit: 2g
    entrypoint: [java, '-Xms256m', '-Xmx1g', '-Dloader.main=it.unina.bugboard26.shared.application.PerformanceSeeder$$MeasurementMain', '-cp', /measurement/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
    environment:
      APP_PROFILE: demo
      PROJECT_NAME: BugBoard26 performance
      DATABASE_URL: jdbc:postgresql://db:5432/${PERFORMANCE_DATABASE:-bugboard26_performance}
      DATABASE_USERNAME: bugboard_runtime
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Missing runtime password}
      MIGRATION_USERNAME: bugboard_owner
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Missing migration password}
      AUTH_IP_HASH_SECRET: ${AUTH_IP_HASH_SECRET:?Missing private IP hashing secret}
      BOOTSTRAP_ENABLED: 'false'
      DEMO_SEED: 'false'
      SESSION_COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:18088,http://127.0.0.1:18088
    volumes:
      - ../output/reports/performance-backend.jar:/measurement/app.jar:ro
    ports:
      - '127.0.0.1:18080:8080'
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: bugboard26-frontend
    cpus: 4
    cpuset: '0-3'
    mem_limit: 256m
    volumes:
      - ./performance-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:18088:8080'
    depends_on:
      backend:
        condition: service_started
volumes:
  performance_db:
