# Separate project, ports, and persistent volume for end-to-end verification.
name: bugboard26-test
services:
  db:
    ports: !override
      - "127.0.0.1:${TEST_DB_PORT:-55434}:5432"
    volumes: !override
      - bugboard26_test_db:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-bugboard26.sh:ro
  backend:
    environment:
      PUBLIC_BASE_URL: http://localhost:${TEST_FRONTEND_PORT:-8089}
      CORS_ALLOWED_ORIGINS: http://localhost:${TEST_FRONTEND_PORT:-8089}
    ports: !override
      - "127.0.0.1:${TEST_BACKEND_PORT:-8081}:8080"
  frontend:
    ports: !override
      - "127.0.0.1:${TEST_FRONTEND_PORT:-8089}:8080"
volumes:
  bugboard26_test_db:
