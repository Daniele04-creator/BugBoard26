map $request_id $generated_request_id {
    "~^(?<id_a>.{8})(?<id_b>.{4})(?<id_c>.{4})(?<id_d>.{4})(?<id_e>.{12})$" $id_a-$id_b-$id_c-$id_d-$id_e;
}
map $http_x_request_id $correlation_id {
    default $generated_request_id;
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
}
map $uri $route_group {
    default "static";
    ~^/api/v1/auth/ "auth";
    ~^/api/v1/health/ "health";
    ~^/api/ "api";
}
log_format safe_json escape=json '{"event":"proxy_request","requestId":"$correlation_id","method":"$request_method","route":"$route_group","status":$status,"durationSeconds":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css;
    access_log /dev/stdout safe_json;
    # Request URLs may contain private search terms. Statuses are recorded in safe_json instead.
    error_log /dev/stderr crit;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    add_header X-Request-ID $correlation_id always;
    error_page 502 503 504 =503 @unavailable;
    error_page 413 =413 @oversized;

    location /api/ {
        gzip off;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Cache-Control;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Servizio non disponibile","status":503,"code":"SERVICE_UNAVAILABLE","detail":"Servizio temporaneamente non disponibile.","instance":"/api","requestId":"$correlation_id","fieldErrors":[]}';
    }

    location @oversized {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Richiesta troppo grande","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"La richiesta supera il limite consentito.","instance":"/api","requestId":"$correlation_id","fieldErrors":[]}';
    }
}
