spring:
  main:
    banner-mode: "off"
  application:
    name: bugboard26
  profiles:
    active: ${APP_PROFILE:demo}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/bugboard26}
    username: ${DATABASE_USERNAME:bugboard_runtime}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/bugboard26}
    user: ${MIGRATION_USERNAME:bugboard_owner}
    password: ${MIGRATION_PASSWORD:}
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        name: BBSESSION
        path: /api
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${LOG_FILE:logs/bugboard26.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 50MB
app:
  profile: ${APP_PROFILE:demo}
  project-name: ${PROJECT_NAME:BugBoard26}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth-ip-hash-secret: ${AUTH_IP_HASH_SECRET:}
  bootstrap-enabled: ${BOOTSTRAP_ENABLED:true}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@bugboard.local}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:BugBoard26-ChangeMe!}
  demo-seed: ${DEMO_SEED:false}
  public-base-url: ${PUBLIC_BASE_URL:}
  session:
    absolute-timeout: 8h
  request:
    max-json-bytes: 131072
---
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
app:
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
